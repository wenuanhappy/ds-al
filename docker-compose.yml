services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 00000000
      MYSQL_DATABASE: ds
      TZ: Asia/Shanghai
      MYSQL_ROOT_HOST: '%'
      MYSQL_INITDB_SKIP_TZINFO: '1'
    # ports:
    #   - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./ds-al.sql:/docker-entrypoint-initdb.d/ds-al.sql
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p00000000"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: ./backend
    image: ds-backend:1.0
    # ports:
    #   - "8080:8080"
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ds?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 00000000
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    image: ds-frontend:1.0
    ports:
      - "9100:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
